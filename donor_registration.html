<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blood Donor Registration</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
}

header {
    background: #c1121f;
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    width: 90%;
    max-width: 700px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.2);
}

h2 {
    color: #c1121f;
    margin-bottom: 20px;
    text-align: center;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
}

input,
select,
textarea {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.checkbox {
    margin-top: 15px;
}

.location-status {
    margin: 15px 0;
    padding: 10px;
    border-radius: 8px;
    background: #f5f5f5;
    font-size: 14px;
}

.location-success {
    color: green;
}

.location-error {
    color: #c1121f;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: #c1121f;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #8d0d18;
}

</style>

</head>

<body>

<header>

<h1>🩸 Blood Donor Registration</h1>

</header>


<div class="container">

<h2>Register as a Blood Donor</h2>


<form
    action="register_donor.php"
    method="POST"
    id="donorForm"
>


<!-- =========================================
     GPS LOCATION
========================================= -->

<input
    type="hidden"
    name="latitude"
    id="donor_latitude"
>

<input
    type="hidden"
    name="longitude"
    id="donor_longitude"
>


<div
    id="locationStatus"
    class="location-status"
>

Getting your location...

</div>


<!-- =========================================
     PERSONAL DETAILS
========================================= -->

<label>Full Name</label>

<input
    type="text"
    name="name"
    placeholder="Enter your full name"
    required
>


<label>Age</label>

<input
    type="number"
    name="age"
    min="18"
    max="65"
    placeholder="Enter your age"
    required
>


<label>Gender</label>

<select name="gender" required>

<option value="">
Select Gender
</option>

<option value="Male">
Male
</option>

<option value="Female">
Female
</option>

<option value="Other">
Other
</option>

</select>


<label>Blood Group</label>

<select name="blood_group" required>

<option value="">
Select Blood Group
</option>

<option value="A+">A+</option>

<option value="A-">A-</option>

<option value="B+">B+</option>

<option value="B-">B-</option>

<option value="AB+">AB+</option>

<option value="AB-">AB-</option>

<option value="O+">O+</option>

<option value="O-">O-</option>

</select>


<label>Mobile Number</label>

<input
    type="tel"
    name="phone"
    id="phone"
    placeholder="Enter 10-digit mobile number"
    maxlength="10"
    minlength="10"
    pattern="[0-9]{10}"
    inputmode="numeric"
    required
>


<label>Email Address</label>

<input
    type="email"
    name="email"
    placeholder="Enter email address"
>


<!-- =========================================
     LOCATION DETAILS
========================================= -->

<label>Country</label>

<select
    id="country"
    name="country"
    required
>

<option value="">
Select Country
</option>

</select>


<label>State</label>

<select
    id="state"
    name="state"
    required
    disabled
>

<option value="">
Select State
</option>

</select>


<label>District</label>

<select
    id="district"
    name="district"
    required
    disabled
>

<option value="">
Select District
</option>

</select>


<!-- =========================================
     CITY
========================================= -->

<label>City</label>

<input
    type="text"
    id="city"
    name="city"
    placeholder="Enter City"
    required
>


<label>Mandal</label>

<select
    id="mandal"
    name="mandal"
    required
    disabled
>

<option value="">
Select Mandal
</option>

</select>


<label>Village / Area</label>

<select
    id="village"
    name="village"
    required
    disabled
>

<option value="">
Select Village / Area
</option>

</select>


<label>PIN Code</label>

<input
    type="text"
    id="pincode"
    name="pin_code"
    placeholder="Automatically selected"
    readonly
>


<!-- =========================================
     OTHER DETAILS
========================================= -->

<label>Weight (kg)</label>

<input
    type="number"
    name="weight"
    placeholder="Enter weight"
>


<label>Last Blood Donation Date</label>

<input
    type="date"
    name="last_donation"
>


<label>Any Medical Conditions?</label>

<input
    type="text"
    name="medical_conditions"
    placeholder="Enter if any"
>


<label>Available to Donate Now?</label>

<select name="available">

<option value="Yes">
Yes
</option>

<option value="No">
No
</option>

</select>


<!-- =========================================
     CONFIRMATION
========================================= -->

<div class="checkbox">

<input
    type="checkbox"
    name="confirm_info"
    value="1"
    required
>

I confirm that the information provided is true.

</div>


<div class="checkbox">

<input
    type="checkbox"
    name="emergency_contact"
    value="1"
    required
>

I agree to be contacted during emergency blood requirements.

</div>


<button type="submit">

🩸 Register as Blood Donor

</button>


</form>

</div>


<script>

/* =====================================================
   GPS LOCATION
===================================================== */

const donorLatInput =
    document.getElementById("donor_latitude");

const donorLngInput =
    document.getElementById("donor_longitude");

const locationStatus =
    document.getElementById("locationStatus");

const donorForm =
    document.getElementById("donorForm");


function getDonorLocation() {

    if (!navigator.geolocation) {

        locationStatus.innerHTML =
            "❌ Location services are not supported by your browser.";

        locationStatus.classList.add(
            "location-error"
        );

        return;

    }


    locationStatus.innerHTML =
        "📍 Getting your location...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            donorLatInput.value =
                position.coords.latitude;

            donorLngInput.value =
                position.coords.longitude;


            locationStatus.innerHTML =
                "✅ Location detected.";

            locationStatus.classList.add(
                "location-success"
            );

        },

        function(error) {

            donorLatInput.value = "";

            donorLngInput.value = "";


            if (error.code === 1) {

                locationStatus.innerHTML =
                    "❌ Location permission denied. Please allow location access.";

            }

            else if (error.code === 2) {

                locationStatus.innerHTML =
                    "❌ Unable to determine your location.";

            }

            else if (error.code === 3) {

                locationStatus.innerHTML =
                    "❌ Location request timed out.";

            }

            else {

                locationStatus.innerHTML =
                    "❌ Unable to get your location.";

            }


            locationStatus.classList.add(
                "location-error"
            );

        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }

    );

}


/* Get location when page loads */

window.addEventListener(
    "load",
    getDonorLocation
);


/* Check location before submission */

donorForm.addEventListener(
    "submit",
    function(event) {

        if (
            donorLatInput.value === "" ||
            donorLngInput.value === ""
        ) {

            event.preventDefault();

            alert(
                "Please allow location access first."
            );

            getDonorLocation();

        }

    }
);


/* =====================================================
   LOCATION SYSTEM
   Country → State → District → City → Mandal → Village
   Village → Automatic PIN Code
===================================================== */

let locationsData = null;


const countrySelect =
    document.getElementById("country");

const stateSelect =
    document.getElementById("state");

const districtSelect =
    document.getElementById("district");

const mandalSelect =
    document.getElementById("mandal");

const villageSelect =
    document.getElementById("village");

const pincodeInput =
    document.getElementById("pincode");


/* =====================================================
   LOAD locations.json
===================================================== */

fetch("locations.json")

.then(function(response) {

    if (!response.ok) {

        throw new Error(
            "locations.json could not be loaded"
        );

    }

    return response.json();

})

.then(function(data) {

    locationsData = data;


    countrySelect.innerHTML =
        '<option value="">Select Country</option>';


    const country =
        locationsData.country;


    const countryOption =
        document.createElement("option");


    countryOption.value =
        country.code;


    countryOption.textContent =
        country.name;


    countrySelect.appendChild(
        countryOption
    );

})

.catch(function(error) {

    console.error(error);

    alert(
        "Unable to load locations.json. " +
        "Make sure the file is inside the HEALTHCARE folder."
    );

});


/* =====================================================
   COUNTRY SELECTED
===================================================== */

countrySelect.addEventListener(
    "change",
    function() {

        clearDropdown(
            stateSelect,
            "Select State"
        );

        clearDropdown(
            districtSelect,
            "Select District"
        );

        clearDropdown(
            mandalSelect,
            "Select Mandal"
        );

        clearDropdown(
            villageSelect,
            "Select Village / Area"
        );


        pincodeInput.value = "";


        if (this.value === "") {

            stateSelect.disabled = true;

            return;

        }


        const country =
            locationsData.country;


        country.states.forEach(
            function(state) {

                const option =
                    document.createElement("option");


                option.value =
                    state.lgdCode;


                option.textContent =
                    state.name;


                stateSelect.appendChild(
                    option
                );

            }
        );


        stateSelect.disabled = false;

    }
);


/* =====================================================
   STATE SELECTED
===================================================== */

stateSelect.addEventListener(
    "change",
    function() {

        clearDropdown(
            districtSelect,
            "Select District"
        );

        clearDropdown(
            mandalSelect,
            "Select Mandal"
        );

        clearDropdown(
            villageSelect,
            "Select Village / Area"
        );


        pincodeInput.value = "";


        if (this.value === "") {

            districtSelect.disabled = true;

            return;

        }


        const country =
            locationsData.country;


        const selectedState =
            country.states.find(
                function(state) {

                    return state.lgdCode ===
                        stateSelect.value;

                }
            );


        if (!selectedState) {

            return;

        }


        selectedState.districts.forEach(
            function(district) {

                const option =
                    document.createElement("option");


                option.value =
                    district.lgdCode;


                option.textContent =
                    district.name;


                districtSelect.appendChild(
                    option
                );

            }
        );


        districtSelect.disabled = false;

    }
);


/* =====================================================
   DISTRICT SELECTED
===================================================== */

districtSelect.addEventListener(
    "change",
    function() {

        clearDropdown(
            mandalSelect,
            "Select Mandal"
        );

        clearDropdown(
            villageSelect,
            "Select Village / Area"
        );


        pincodeInput.value = "";


        if (this.value === "") {

            mandalSelect.disabled = true;

            return;

        }


        const selectedState =
            locationsData.country.states.find(
                function(state) {

                    return state.lgdCode ===
                        stateSelect.value;

                }
            );


        if (!selectedState) {

            return;

        }


        const selectedDistrict =
            selectedState.districts.find(
                function(district) {

                    return district.lgdCode ===
                        districtSelect.value;

                }
            );


        if (!selectedDistrict) {

            return;

        }


        selectedDistrict.mandals.forEach(
            function(mandal) {

                const option =
                    document.createElement("option");


                option.value =
                    mandal.lgdCode;


                option.textContent =
                    mandal.name;


                mandalSelect.appendChild(
                    option
                );

            }
        );


        mandalSelect.disabled = false;

    }
);


/* =====================================================
   MANDAL SELECTED
===================================================== */

mandalSelect.addEventListener(
    "change",
    function() {

        clearDropdown(
            villageSelect,
            "Select Village / Area"
        );


        pincodeInput.value = "";


        if (this.value === "") {

            villageSelect.disabled = true;

            return;

        }


        const selectedState =
            locationsData.country.states.find(
                function(state) {

                    return state.lgdCode ===
                        stateSelect.value;

                }
            );


        if (!selectedState) {

            return;

        }


        const selectedDistrict =
            selectedState.districts.find(
                function(district) {

                    return district.lgdCode ===
                        districtSelect.value;

                }
            );


        if (!selectedDistrict) {

            return;

        }


        const selectedMandal =
            selectedDistrict.mandals.find(
                function(mandal) {

                    return mandal.lgdCode ===
                        mandalSelect.value;

                }
            );


        if (!selectedMandal) {

            return;

        }


        selectedMandal.villages.forEach(
            function(village) {

                const option =
                    document.createElement("option");


                option.value =
                    village.lgdCode;


                option.textContent =
                    village.name;


                option.dataset.pincode =
                    village.pincode || "";


                villageSelect.appendChild(
                    option
                );

            }
        );


        villageSelect.disabled = false;

    }
);


/* =====================================================
   VILLAGE SELECTED
===================================================== */

villageSelect.addEventListener(
    "change",
    function() {

        const selectedOption =
            this.options[this.selectedIndex];


        const pin =
            selectedOption.dataset.pincode;


        if (pin) {

            pincodeInput.value =
                pin;

        }

        else {

            pincodeInput.value =
                "";

        }

    }
);


/* =====================================================
   CLEAR DROPDOWN
===================================================== */

function clearDropdown(
    selectElement,
    placeholder
) {

    selectElement.innerHTML = "";


    const option =
        document.createElement("option");


    option.value = "";


    option.textContent =
        placeholder;


    selectElement.appendChild(
        option
    );


    selectElement.disabled = true;

}

</script>


</body>

</html>
