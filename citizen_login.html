<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Citizen Login - Healthcare</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f5ff, #f7fbff);
        }
_
        .login-container {
            width: 420px;
            max-width: 92%;
            background: white;+
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #123c69;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 18px;
            outline: none;
        }

        input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #084298;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
        }

        .success {
            background: #e4f7e9;
            color: #167c2f;
        }

        .register-text {
            text-align: center;
            margin-top: 22px;
            color: #555;
            font-size: 14px;
        }

        .register-text a {
            color: #0d6efd;
            font-weight: bold;
            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: #0d6efd;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">🏥</div>

    <h1>Citizen Login</h1>

    <p class="subtitle">
        Login to access your healthcare records
    </p>

    <form id="loginForm">

        <label for="identifier">
            Mobile Number or Email
        </label>

        <input
            type="text"
            id="identifier"
            name="identifier"
            placeholder="Enter mobile number or email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="register-text">
        Don't have an account?
        <a href="citizen_register.html">Sign Up</a>
    </div>

    <a href="index.html" class="back-home">
        ← Back to Home
    </a>

</div>


<script>

document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const identifier =
        document.getElementById("identifier").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    message.style.display = "none";

    try {

        const response = await fetch("citizen_login.php", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                identifier: identifier,
                password: password
            })

        });

        const data = await response.json();

        if (data.success) {

            message.className = "message success";

            message.textContent =
                "Login successful!";

            message.style.display = "block";

            // Store logged-in citizen information
            localStorage.setItem(
                "citizenUser",
                JSON.stringify(data.user)
            );

            // Open dashboard
            setTimeout(function() {

                window.location.href =
                    "citizen_dashboard.html";

            }, 1000);

        } else {

            message.className = "message error";

            message.textContent =
                data.message || "Login failed.";

            message.style.display = "block";
        }

    } catch (error) {

        console.error(error);

        message.className = "message error";

        message.textContent =
            "Unable to connect to the server. Please check XAMPP and try again.";

        message.style.display = "block";
    }

});

</script>

</body>
</html>
